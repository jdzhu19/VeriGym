schema_version: "1.0"
name: "codex-cli-four-run-conformance-smoke"
description: "Fixed all-or-none real smoke plan; execute only with the protected launcher."

tasks:
  - "toy-rtl/and-gate-basic"
  - "toy-rtl/counter-basic"
tracks:
  - id: "codex_cli_readonly_single_turn_agent"
    label: "Codex CLI read-only single-turn agent"
    model_plugin: null
    agent_plugin: "codex-cli-readonly-agent"
    interaction_mode: "agent"
    execution_surface: "codex_cli"
    interaction_class: "cli_agent_single_turn_readonly"
    chat_eval_compatible: false
    pure_api_model_eval: false
    direct_api_benchmark: false
  - id: "codex_cli_external_agent"
    label: "Codex CLI workspace-writing external agent"
    model_plugin: null
    agent_plugin: "codex-cli-agent"
    interaction_mode: "agent"
    execution_surface: "codex_cli"
    interaction_class: "cli_agent_workspace_writing"
    chat_eval_compatible: false
    pure_api_model_eval: false
    direct_api_benchmark: false

sampling:
  seeds: [0]
  samples_per_task: 1

execution:
  planned_runs: 4
  max_codex_processes: 4
  requested_reasoning_effort: "xhigh"
  effective_reasoning_effort: "xhigh"
  reasoning_effort_source: "verigym_explicit_cli_override"
  inherited_reasoning_effort_allowed: false
  max_process_time_s: 300
  max_total_wall_time_s: 1800
  allow_retry: false
  allow_best_of_k_selection: false
  allow_outer_agent_repair: false

required_environment:
  - "VERIGYM_RUN_CODEX_CLI_TESTS=1"
  - "VERIGYM_CODEX_BINARY=/absolute/path/to/codex"
  - "VERIGYM_CODEX_MODEL=<explicit-model-id>"
  - "VERIGYM_CODEX_AUTH_MODE=<secret-free-label>"
  - "VERIGYM_CODEX_CAPABILITY_FILE=/absolute/path/to/doctor-report.json"

launcher: "python scripts/run_codex_cli_smoke.py --output <new-audit-directory>"
