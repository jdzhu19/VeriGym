name: Optional provisioned integrations

on:
  workflow_dispatch:
    inputs:
      verilog_eval_root:
        description: Pre-provisioned, pinned VerilogEval checkout path on a labeled runner
        required: false
        type: string

permissions:
  contents: read

jobs:
  local-open-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Provision optional open tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
      - name: Local Icarus acceptance
        run: pytest -m integration -k "not docker and not yosys"
      - name: Local Yosys acceptance
        env:
          VERIGYM_RUN_YOSYS_TESTS: "1"
        run: pytest -m yosys

  external-verilog-eval:
    if: ${{ inputs.verilog_eval_root != '' }}
    runs-on: [self-hosted, linux, verigym-external]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - name: Confirm pre-provisioned checkout
        env:
          VERIGYM_VERILOG_EVAL_ROOT: ${{ inputs.verilog_eval_root }}
        run: test -d "$VERIGYM_VERILOG_EVAL_ROOT"
      - name: Real external-path conformance
        env:
          VERIGYM_VERILOG_EVAL_ROOT: ${{ inputs.verilog_eval_root }}
        run: pytest -m external_benchmark

  external-not-requested:
    if: ${{ inputs.verilog_eval_root == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Explicit blocked reason
        run: >-
          echo "External VerilogEval was not run: no pre-provisioned checkout path was supplied."
