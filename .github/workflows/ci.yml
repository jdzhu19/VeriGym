name: Ordinary checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core and optional integrations
        run: |
          python -m pip install -e '.[dev,openai-compatible,hwe-collection]'
          python -m pip install 'numpy==2.3.2' 'transformers==4.57.6'
          python -m pip install -e integrations/verigym-codex-cli
          python -m pip install -e integrations/verigym-claude-cli
          python -m pip install -e integrations/verigym-deepseek-harness
          python -m pip install -e integrations/verigym-rtl-repo
          python -m pip install -e integrations/verigym-hwe-bench
          python -m pip install -e integrations/verigym-verilog-eval-codecomplete
          python -m pip install -e integrations/verigym-rtllm
          python -m pip install -e integrations/verigym-synopsys
          python -m pip install -e integrations/verigym-training-reference
      - name: Format, lint, type, and patch hygiene
        run: |
          ruff format --check .
          ruff check .
          mypy --strict src/verigym
          mypy --strict integrations/verigym-codex-cli/src/verigym_codex_cli
          mypy --strict integrations/verigym-claude-cli/src/verigym_claude_cli
          mypy --strict integrations/verigym-rtl-repo/src/verigym_rtl_repo
          mypy --strict integrations/verigym-hwe-bench/src/verigym_hwe_bench
          mypy --strict \
            integrations/verigym-verilog-eval-codecomplete/src/verigym_verilog_eval_codecomplete
          mypy --strict integrations/verigym-rtllm/src/verigym_rtllm
          mypy --strict integrations/verigym-synopsys/src/verigym_synopsys
          mypy --strict \
            integrations/verigym-training-reference/src/verigym_training_reference
          git diff --check
      - name: Persistent-schema drift
        run: python scripts/export_schemas.py --check
      - name: Documentation and example contracts
        run: >-
          pytest
          tests/unit/test_audit_contracts.py::test_required_documentation_and_adrs_exist_and_examples_compile
          tests/unit/test_release_contracts.py::test_schema_export_has_no_drift

  ordinary:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install without RTL or container tools
        env:
          VERIGYM_CI_PYTHON: ${{ matrix.python }}
        run: |
          python -m pip install -e '.[dev,openai-compatible]'
          if [[ "$VERIGYM_CI_PYTHON" != "3.13" ]]; then
            python -m pip install -e '.[hwe-collection]'
          fi
          python -m pip install 'numpy==2.3.2' 'transformers==4.57.6'
          python -m pip install -e integrations/verigym-codex-cli
          python -m pip install -e integrations/verigym-claude-cli
          python -m pip install -e integrations/verigym-deepseek-harness
          python -m pip install -e integrations/verigym-rtl-repo
          python -m pip install -e integrations/verigym-hwe-bench
          python -m pip install -e integrations/verigym-verilog-eval-codecomplete
          python -m pip install -e integrations/verigym-rtllm
          python -m pip install -e integrations/verigym-synopsys
          python -m pip install -e integrations/verigym-training-reference
      - name: Run ordinary no-daemon tests
        run: |
          pytest \
            -m "not requires_iverilog and not docker and not yosys and not external_benchmark and not release_audit"
          pytest integrations/verigym-claude-cli/tests
          pytest integrations/verigym-rtl-repo/tests \
            -m "not external_benchmark"
          pytest -c integrations/verigym-hwe-bench/pyproject.toml \
            integrations/verigym-hwe-bench/tests -m "not docker and not external_benchmark"
          pytest integrations/verigym-verilog-eval-codecomplete/tests \
            -m "not external_benchmark"
          pytest -c integrations/verigym-rtllm/pyproject.toml \
            integrations/verigym-rtllm/tests -m "not commercial"
          pytest -c integrations/verigym-synopsys/pyproject.toml \
            integrations/verigym-synopsys/tests -m "not commercial"
          pytest -c integrations/verigym-training-reference/pyproject.toml \
            integrations/verigym-training-reference/tests

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,openai-compatible]'
      - name: Build wheel and sdist
        env:
          SOURCE_DATE_EPOCH: "1784712454"
        run: |
          python -m build
          python -m build integrations/verigym-codex-cli \
            --outdir integrations/verigym-codex-cli/dist
          python -m build integrations/verigym-claude-cli \
            --outdir integrations/verigym-claude-cli/dist
          python -m build integrations/verigym-rtl-repo \
            --outdir integrations/verigym-rtl-repo/dist
          python -m build integrations/verigym-hwe-bench \
            --outdir integrations/verigym-hwe-bench/dist
          python -m build integrations/verigym-verilog-eval-codecomplete \
            --outdir integrations/verigym-verilog-eval-codecomplete/dist
          python -m build integrations/verigym-rtllm \
            --outdir integrations/verigym-rtllm/dist
          python -m build integrations/verigym-synopsys \
            --outdir integrations/verigym-synopsys/dist
          python -m build integrations/verigym-training-reference \
            --outdir integrations/verigym-training-reference/dist
      - name: Scan package contents and metadata
        run: |
          python scripts/audit_distribution.py \
            --wheel dist/verigym-0.1.0-py3-none-any.whl \
            --sdist dist/verigym-0.1.0.tar.gz
          python scripts/audit_codex_cli_distribution.py \
            --wheel integrations/verigym-codex-cli/dist/verigym_codex_cli-0.1.0-py3-none-any.whl \
            --sdist integrations/verigym-codex-cli/dist/verigym_codex_cli-0.1.0.tar.gz
          python scripts/audit_optional_plugin_distribution.py \
            --policy claude_cli \
            --wheel integrations/verigym-claude-cli/dist/verigym_claude_cli-0.1.0-py3-none-any.whl \
            --sdist integrations/verigym-claude-cli/dist/verigym_claude_cli-0.1.0.tar.gz
          python scripts/audit_optional_plugin_distribution.py \
            --policy rtl_repo \
            --wheel integrations/verigym-rtl-repo/dist/verigym_rtl_repo-0.1.0-py3-none-any.whl \
            --sdist integrations/verigym-rtl-repo/dist/verigym_rtl_repo-0.1.0.tar.gz
          python scripts/audit_optional_plugin_distribution.py \
            --policy hwe_bench \
            --wheel integrations/verigym-hwe-bench/dist/verigym_hwe_bench-0.1.0-py3-none-any.whl \
            --sdist integrations/verigym-hwe-bench/dist/verigym_hwe_bench-0.1.0.tar.gz
          python scripts/audit_optional_plugin_distribution.py \
            --policy rtllm \
            --wheel integrations/verigym-rtllm/dist/verigym_rtllm-0.3.0-py3-none-any.whl \
            --sdist integrations/verigym-rtllm/dist/verigym_rtllm-0.3.0.tar.gz
          python scripts/audit_optional_plugin_distribution.py \
            --policy synopsys \
            --wheel integrations/verigym-synopsys/dist/verigym_synopsys-0.1.0-py3-none-any.whl \
            --sdist integrations/verigym-synopsys/dist/verigym_synopsys-0.1.0.tar.gz
          python scripts/audit_optional_plugin_distribution.py \
            --policy training_reference \
            --wheel integrations/verigym-training-reference/dist/verigym_training_reference-0.3.0-py3-none-any.whl \
            --sdist integrations/verigym-training-reference/dist/verigym_training_reference-0.3.0.tar.gz
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          wheel = (
              "integrations/verigym-verilog-eval-codecomplete/dist/"
              "verigym_verilog_eval_codecomplete-0.1.0-py3-none-any.whl"
          )
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              task_suffixes = ("_prompt.txt", "_ifc.txt", "_ref.sv", "_test.sv")
              assert not any(name.endswith(task_suffixes) for name in names)
              assert not any("/tests/" in f"/{name}" for name in names)
              assert not any("/scripts/" in f"/{name}" for name in names)
              entry_name = next(
                  name for name in names if PurePosixPath(name).name == "entry_points.txt"
              )
              entries = archive.read(entry_name).decode("utf-8")
              assert "[verigym.suites]" in entries
              assert "verilog-eval-code-complete" in entries
          print("VerilogEval plugin wheel contains adapter assets but no benchmark tasks")
          PY
      - name: Install Icarus Verilog for installed API conformance
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iverilog
          iverilog -V
          vvp -V
      - name: Run Icarus-backed fake Codex tests
        run: pytest -m requires_iverilog
      - name: Installed wheel, plugin, CLI, and public API
        run: >-
          python scripts/installed_conformance.py
          --wheel dist/verigym-0.1.0-py3-none-any.whl
          --output /tmp/installed-conformance.json
      - name: Installed integration entry points
        run: |
          python -m venv /tmp/verigym-codex-plugin-venv
          /tmp/verigym-codex-plugin-venv/bin/pip install \
            dist/verigym-0.1.0-py3-none-any.whl \
            integrations/verigym-codex-cli/dist/verigym_codex_cli-0.1.0-py3-none-any.whl \
            integrations/verigym-claude-cli/dist/verigym_claude_cli-0.1.0-py3-none-any.whl \
            integrations/verigym-rtl-repo/dist/verigym_rtl_repo-0.1.0-py3-none-any.whl \
            integrations/verigym-hwe-bench/dist/verigym_hwe_bench-0.1.0-py3-none-any.whl \
            integrations/verigym-verilog-eval-codecomplete/dist/verigym_verilog_eval_codecomplete-0.1.0-py3-none-any.whl \
            integrations/verigym-rtllm/dist/verigym_rtllm-0.3.0-py3-none-any.whl \
            integrations/verigym-synopsys/dist/verigym_synopsys-0.1.0-py3-none-any.whl
          /tmp/verigym-codex-plugin-venv/bin/pip install \
            integrations/verigym-training-reference/dist/verigym_training_reference-0.3.0-py3-none-any.whl
          /tmp/verigym-codex-plugin-venv/bin/pip check
          cd /tmp
          /tmp/verigym-codex-plugin-venv/bin/python - <<'PY'
          from verigym.core.errors import PluginNotFoundError
          from verigym.registry.collections import build_registries
          from verigym_claude_cli import ClaudeCliAgentAdapter
          from verigym_codex_cli import resolve_auth_mode

          registries = build_registries()
          assert (
              registries.agents.origin("codex-cli-readonly-agent").package
              == "verigym-codex-cli"
          )
          assert registries.agents.origin("codex-cli-agent").package == "verigym-codex-cli"
          assert registries.agents.origin("claude-cli-agent").package == "verigym-claude-cli"
          assert ClaudeCliAgentAdapter.descriptor.name == "claude-cli-agent"
          assert (
              registries.suites.origin("verilog-eval-code-complete").package
              == "verigym-verilog-eval-codecomplete"
          )
          assert registries.suites.origin("rtl-repo").package == "verigym-rtl-repo"
          assert registries.suites.origin("hwe-bench").package == "verigym-hwe-bench"
          assert registries.agents.origin("hwe-bench-probe").package == "verigym-hwe-bench"
          assert registries.tools.origin("rtl_repo.score").package == "verigym-rtl-repo"
          assert registries.suites.origin("rtllm").package == "verigym-rtllm"
          assert (
              registries.tools.origin("synopsys.vcs.simulate").package
              == "verigym-synopsys"
          )
          assert (
              registries.tools.origin("synopsys.dc.synth").package
              == "verigym-synopsys"
          )
          try:
              registries.models.origin("codex-cli-exec-model")
          except PluginNotFoundError:
              pass
          else:
              raise AssertionError("retired Codex CLI model entry point remains installed")
          assert (
              resolve_auth_mode("chatgpt_cli_session").resolved_auth_mode
              == "inherited_codex_login"
          )
          print("installed integration entry points discovered")
          PY
          /tmp/verigym-codex-plugin-venv/bin/verigym-training-reference --help
          /tmp/verigym-codex-plugin-venv/bin/verigym-hwe-bench --help
      - name: Installed VerilogEval plugin zero-model smoke
        run: |
          cd /tmp
          /tmp/verigym-codex-plugin-venv/bin/python \
            "$GITHUB_WORKSPACE/integrations/verigym-verilog-eval-codecomplete/scripts/run_synthetic_smoke.py" \
            --output /tmp/verigym-verilog-eval-codecomplete-smoke
      - name: Installed repository RTL repair conformance
        run: |
          cd /tmp
          /tmp/verigym-codex-plugin-venv/bin/verigym run \
            --suite repo-rtl \
            --task counter-wrap \
            --mode agent \
            --agent repo-scripted-good \
            --runtime local \
            --output /tmp/verigym-installed-repo-rtl
          /tmp/verigym-codex-plugin-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(
              Path("/tmp/verigym-installed-repo-rtl").glob("*/run_manifest.json")
          )
          scorecards = sorted(
              Path("/tmp/verigym-installed-repo-rtl").glob("*/scorecard.json")
          )
          assert len(manifests) == len(scorecards) == 1
          manifest = json.loads(manifests[0].read_text())
          scorecard = json.loads(scorecards[0].read_text())
          assert scorecard["resolved"] is True
          assert scorecard["efficiency"]["model_calls"] == 0
          assert manifest["repository_candidate"]["patch"]["reapply_exact"] is True
          assert len(manifest["repository_public_tests"]) == 1
          assert manifest["repository_public_tests"][0]["passed"] is True
          assert (
              manifest["repository_public_tests"][0]["network_policy"]
              == "host_local_trusted"
          )
          print("installed repository RTL repair conformance passed")
          PY
      - name: Installed Codex CLI fake four-run flow
        env:
          VERIGYM_RUN_CODEX_CLI_TESTS: "1"
          VERIGYM_CODEX_BINARY: ${{ github.workspace }}/integrations/verigym-codex-cli/tests/fake_codex.py
          VERIGYM_CODEX_MODEL: fake-installed-conformance
          VERIGYM_CODEX_AUTH_MODE: chatgpt_cli_session
          VERIGYM_CODEX_TEST_MODE: "1"
          VERIGYM_FAKE_CODEX_SCENARIO: valid
          VERIGYM_FAKE_CODEX_LOG: /tmp/verigym-codex-fake-calls.jsonl
          VERIGYM_CODEX_CAPABILITY_FILE: /tmp/verigym-codex-capabilities.json
        run: |
          cd /tmp
          /tmp/verigym-codex-plugin-venv/bin/verigym-codex doctor \
            --json "$VERIGYM_CODEX_CAPABILITY_FILE"
          /tmp/verigym-codex-plugin-venv/bin/verigym-codex auth-preflight \
            --json /tmp/verigym-codex-auth-preflight.json
          /tmp/verigym-codex-plugin-venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/run_codex_cli_smoke.py" \
            --output /tmp/verigym-codex-fake-smoke
          /tmp/verigym-codex-plugin-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          calls = [
              json.loads(line)
              for line in Path("/tmp/verigym-codex-fake-calls.jsonl").read_text().splitlines()
          ]
          acceptance = json.loads(
              Path(
                  "/tmp/verigym-codex-fake-smoke/evidence/smoke_acceptance.json"
              ).read_text()
          )
          preflight = json.loads(
              Path("/tmp/verigym-codex-auth-preflight.json").read_text()
          )
          assert sum(call["kind"] == "diagnostic" for call in calls) == 4
          assert sum(call["kind"] == "model" for call in calls) == 4
          assert preflight["requested_auth_mode"] == "chatgpt_cli_session"
          assert preflight["resolved_auth_mode"] == "inherited_codex_login"
          assert preflight["model_calls"] == 0
          assert preflight["login_processes"] == 0
          assert acceptance["gate"] == "PASS"
          print("installed Codex CLI fake flow passed")
          PY
      - name: Install the sdist in a separate environment
        run: |
          python -m venv /tmp/verigym-sdist-venv
          /tmp/verigym-sdist-venv/bin/pip install dist/verigym-0.1.0.tar.gz
          /tmp/verigym-sdist-venv/bin/pip check
          cd /tmp
          /tmp/verigym-sdist-venv/bin/python -c "import verigym; print(verigym.__version__)"

  docker-agent-security:
    name: Docker external-agent zero-model security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source, plugin, and test tools
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e integrations/verigym-codex-cli
      - name: Build explicit Icarus 12 verifier image
        run: >-
          docker build
          -f docker/iverilog12/Dockerfile
          -t verigym/rtl-iverilog:12.0
          docker/iverilog12
      - name: Install and verify exact Codex CLI 0.144.6
        run: |
          npm install --prefix /tmp/verigym-codex-01446 @openai/codex@0.144.6
          codex_native=$(
            find /tmp/verigym-codex-01446/node_modules \
              -type f \
              -path '*/vendor/x86_64-unknown-linux-musl/bin/codex' \
              -print \
              -quit
          )
          test -n "$codex_native"
          test "$(
            sha256sum "$codex_native" | awk '{print $1}'
          )" = "a31ae9450a26216eb1e7c53102fd42123dd675974310b0e2ca3aa4cb622a2c15"
          test "$(
            sha256sum \
              /tmp/verigym-codex-01446/node_modules/@openai/codex/bin/codex.js \
              | awk '{print $1}'
          )" = "134063e133f0b4244fa3b251acf973d4fe4b4aeeacbdc135211bf480f59f1477"
          printf 'CODEX_NATIVE=%s\n' "$codex_native" >> "$GITHUB_ENV"
      - name: Build credential-free immutable Codex exec-server image
        run: >-
          scripts/build_codex_agent_image.sh
          "$CODEX_NATIVE"
          verigym/codex-exec-server:0.144.6
      - name: Build credential-free repository-agent image
        run: >-
          scripts/build_codex_repository_agent_image.sh
          "$CODEX_NATIVE"
          verigym/rtl-iverilog:12.0
          verigym/codex-repository-agent:0.144.6
      - name: Run runtime-owned fake-provider security path
        env:
          VERIGYM_RUN_DOCKER_TESTS: "1"
          VERIGYM_DOCKER_IMAGE: verigym/rtl-iverilog:12.0
          VERIGYM_CODEX_AGENT_IMAGE: verigym/codex-exec-server:0.144.6
          VERIGYM_CODEX_BINARY: /tmp/verigym-codex-01446/node_modules/.bin/codex
        run: pytest -q -m docker tests/integration/test_docker_codex_external_agent.py
      - name: Run repository-agent public, freeze, and fake-provider paths
        env:
          VERIGYM_RUN_DOCKER_TESTS: "1"
          VERIGYM_DOCKER_IMAGE: verigym/rtl-iverilog:12.0
          VERIGYM_CODEX_REPOSITORY_AGENT_IMAGE: verigym/codex-repository-agent:0.144.6
          VERIGYM_CODEX_BINARY: /tmp/verigym-codex-01446/node_modules/.bin/codex
        run: pytest -q -m docker tests/integration/test_docker_repository_agent.py
      - name: Run credential-isolated generic API repository-agent path
        env:
          VERIGYM_RUN_DOCKER_TESTS: "1"
          VERIGYM_DOCKER_IMAGE: verigym/rtl-iverilog:12.0
          VERIGYM_CODEX_REPOSITORY_AGENT_IMAGE: verigym/codex-repository-agent:0.144.6
        run: pytest -q -m docker tests/integration/test_docker_api_repository_agent.py
      - name: Verify historical Track B candidate dispositions with Icarus 12
        run: |
          git clone https://github.com/NVlabs/verilog-eval.git /tmp/verilog-eval
          git -C /tmp/verilog-eval checkout c498220d0a52248f8e3fdffe279075215bde2da6
          VERIGYM_VERILOG_EVAL_ROOT=/tmp/verilog-eval \
          VERIGYM_DOCKER_IMAGE=verigym/rtl-iverilog:12.0 \
            pytest -q \
            -m external_benchmark \
            tests/codex_cli/test_verilog_eval_pilot_candidates.py::test_f6b159b_track_b_forensic_candidates_reach_exact_hidden_verifier

  reproducible-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Compare two normalized wheel and sdist builds
        run: >-
          python scripts/reproducible_build.py
          --package-output /tmp/verigym-packages
          --report /tmp/reproducible-build.json
          --source-date-epoch 1784712454
