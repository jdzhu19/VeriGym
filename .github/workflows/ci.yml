name: Ordinary checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,openai-compatible]'
      - name: Format, lint, type, and patch hygiene
        run: |
          ruff format --check .
          ruff check .
          mypy --strict src/verigym
          mypy --strict integrations/verigym-codex-cli/src/verigym_codex_cli
          git diff --check
      - name: Persistent-schema drift
        run: python scripts/export_schemas.py --check
      - name: Documentation and example contracts
        run: >-
          pytest
          tests/unit/test_audit_contracts.py::test_required_documentation_and_adrs_exist_and_examples_compile
          tests/unit/test_release_contracts.py::test_schema_export_has_no_drift

  ordinary:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install without RTL or container tools
        run: python -m pip install -e '.[dev,openai-compatible]'
      - name: Run ordinary no-daemon tests
        run: >-
          pytest
          -m "not requires_iverilog and not docker and not yosys and not external_benchmark and not release_audit"

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Build wheel and sdist
        env:
          SOURCE_DATE_EPOCH: "1784712454"
        run: |
          python -m build
          python -m build integrations/verigym-codex-cli \
            --outdir integrations/verigym-codex-cli/dist
      - name: Scan package contents and metadata
        run: |
          python scripts/audit_distribution.py \
            --wheel dist/verigym-0.1.0-py3-none-any.whl \
            --sdist dist/verigym-0.1.0.tar.gz
          python scripts/audit_codex_cli_distribution.py \
            --wheel integrations/verigym-codex-cli/dist/verigym_codex_cli-0.1.0-py3-none-any.whl \
            --sdist integrations/verigym-codex-cli/dist/verigym_codex_cli-0.1.0.tar.gz
      - name: Install Icarus Verilog for installed API conformance
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iverilog
          iverilog -V
          vvp -V
      - name: Run Icarus-backed fake Codex tests
        run: pytest -m requires_iverilog
      - name: Installed wheel, plugin, CLI, and public API
        run: >-
          python scripts/installed_conformance.py
          --wheel dist/verigym-0.1.0-py3-none-any.whl
          --output /tmp/installed-conformance.json
      - name: Installed Codex CLI plugin entry points
        run: |
          python -m venv /tmp/verigym-codex-plugin-venv
          /tmp/verigym-codex-plugin-venv/bin/pip install \
            dist/verigym-0.1.0-py3-none-any.whl \
            integrations/verigym-codex-cli/dist/verigym_codex_cli-0.1.0-py3-none-any.whl
          /tmp/verigym-codex-plugin-venv/bin/pip check
          cd /tmp
          /tmp/verigym-codex-plugin-venv/bin/python - <<'PY'
          from verigym.core.errors import PluginNotFoundError
          from verigym.registry.collections import build_registries
          from verigym_codex_cli import resolve_auth_mode

          registries = build_registries()
          assert (
              registries.agents.origin("codex-cli-readonly-agent").package
              == "verigym-codex-cli"
          )
          assert registries.agents.origin("codex-cli-agent").package == "verigym-codex-cli"
          try:
              registries.models.origin("codex-cli-exec-model")
          except PluginNotFoundError:
              pass
          else:
              raise AssertionError("retired Codex CLI model entry point remains installed")
          assert (
              resolve_auth_mode("chatgpt_cli_session").resolved_auth_mode
              == "inherited_codex_login"
          )
          print("installed Codex CLI entry points discovered")
          PY
      - name: Installed Codex CLI fake four-run flow
        env:
          VERIGYM_RUN_CODEX_CLI_TESTS: "1"
          VERIGYM_CODEX_BINARY: ${{ github.workspace }}/integrations/verigym-codex-cli/tests/fake_codex.py
          VERIGYM_CODEX_MODEL: fake-installed-conformance
          VERIGYM_CODEX_AUTH_MODE: chatgpt_cli_session
          VERIGYM_CODEX_TEST_MODE: "1"
          VERIGYM_FAKE_CODEX_SCENARIO: valid
          VERIGYM_FAKE_CODEX_LOG: /tmp/verigym-codex-fake-calls.jsonl
          VERIGYM_CODEX_CAPABILITY_FILE: /tmp/verigym-codex-capabilities.json
        run: |
          cd /tmp
          /tmp/verigym-codex-plugin-venv/bin/verigym-codex doctor \
            --json "$VERIGYM_CODEX_CAPABILITY_FILE"
          /tmp/verigym-codex-plugin-venv/bin/verigym-codex auth-preflight \
            --json /tmp/verigym-codex-auth-preflight.json
          /tmp/verigym-codex-plugin-venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/run_codex_cli_smoke.py" \
            --output /tmp/verigym-codex-fake-smoke
          /tmp/verigym-codex-plugin-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          calls = [
              json.loads(line)
              for line in Path("/tmp/verigym-codex-fake-calls.jsonl").read_text().splitlines()
          ]
          acceptance = json.loads(
              Path(
                  "/tmp/verigym-codex-fake-smoke/evidence/smoke_acceptance.json"
              ).read_text()
          )
          preflight = json.loads(
              Path("/tmp/verigym-codex-auth-preflight.json").read_text()
          )
          assert sum(call["kind"] == "diagnostic" for call in calls) == 4
          assert sum(call["kind"] == "model" for call in calls) == 4
          assert preflight["requested_auth_mode"] == "chatgpt_cli_session"
          assert preflight["resolved_auth_mode"] == "inherited_codex_login"
          assert preflight["model_calls"] == 0
          assert preflight["login_processes"] == 0
          assert acceptance["gate"] == "PASS"
          print("installed Codex CLI fake flow passed")
          PY
      - name: Install the sdist in a separate environment
        run: |
          python -m venv /tmp/verigym-sdist-venv
          /tmp/verigym-sdist-venv/bin/pip install dist/verigym-0.1.0.tar.gz
          /tmp/verigym-sdist-venv/bin/pip check
          cd /tmp
          /tmp/verigym-sdist-venv/bin/python -c "import verigym; print(verigym.__version__)"

  reproducible-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Compare two normalized wheel and sdist builds
        run: >-
          python scripts/reproducible_build.py
          --package-output /tmp/verigym-packages
          --report /tmp/reproducible-build.json
          --source-date-epoch 1784712454
