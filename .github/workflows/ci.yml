name: Ordinary checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ordinary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install without RTL or container tools
        run: python -m pip install -e '.[dev]'
      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Run ordinary no-daemon tests
        run: pytest
