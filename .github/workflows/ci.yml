name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install VeriGym and plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/jdzhu19/VeriGym.git@main"
          python -m pip install -e ".[dev]"
      - name: Check style and types
        run: |
          ruff check .
          ruff format --check .
          mypy src
      - name: Run ordinary tests
        run: pytest
      - name: Build distributions
        run: python -m build
      - name: Verify suite entry point
        run: verigym suites inspect verilog-eval-code-complete
