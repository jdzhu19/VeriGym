[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "verigym_build_backend"
backend-path = ["build_backend"]

[project]
name = "verigym"
version = "0.1.0"
description = "An executable interoperability layer for RTL LLM evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "VeriGym contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.urls]
Documentation = "https://github.com/jdzhu19/VeriGym#readme"
Issues = "https://github.com/jdzhu19/VeriGym/issues"
Repository = "https://github.com/jdzhu19/VeriGym"

[project.optional-dependencies]
openai-compatible = [
  "httpx>=0.27,<1",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5.0,<8",
  "jsonschema>=4.22,<5",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0",
]

[project.scripts]
verigym = "verigym.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verigym = [
  "_build_provenance.json",
  "profiles/builtins/*.yaml",
  "profiles/builtins/assets/*",
  "suites/toy_rtl/assets/**/*",
  "suites/verilog_eval/assets/**/*",
]

[tool.setuptools.exclude-package-data]
verigym = [
  "**/__pycache__/*",
  "**/*.pyc",
  "suites/toy_rtl/assets/**/__pycache__/*",
  "suites/verilog_eval/assets/**/__pycache__/*",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises an installed external RTL tool",
  "conformance: validates suite semantics",
  "docker: exercises the opt-in real Docker runtime",
  "yosys: exercises an opt-in real local Yosys installation",
  "docker_yosys: exercises the opt-in pinned Docker Yosys profile",
  "docker_batch: exercises an opt-in Docker-backed Milestone 9 batch",
  "yosys_batch: exercises an opt-in area-profile Milestone 9 batch",
  "verilog_eval_batch: exercises an opt-in external-path VerilogEval batch",
  "external_benchmark: exercises a user-supplied real benchmark checkout",
  "reproducible_build: rebuilds and compares local distribution archives",
  "release_audit: validates a generated local release-audit bundle",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/verigym/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym"]
