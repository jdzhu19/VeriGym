[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "verigym-claude-cli"
version = "0.1.0"
description = "Auditable Claude CLI external-agent integration for VeriGym."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["verigym==0.1.0"]

[project.entry-points."verigym.agents"]
claude-cli-agent = "verigym_claude_cli:ClaudeCliAgentAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["claude_cli: exercises the Claude CLI integration path"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym_claude_cli"]
