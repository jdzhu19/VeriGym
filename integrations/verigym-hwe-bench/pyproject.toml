[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "verigym-hwe-bench"
version = "0.1.0"
description = "Digest-locked HWE-Bench repository-repair adapter for VeriGym."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "VeriGym contributors"}]
dependencies = ["verigym>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.entry-points."verigym.suites"]
hwe-bench = "verigym_hwe_bench:HweBenchSuite"

[project.entry-points."verigym.agents"]
hwe-bench-probe = "verigym_hwe_bench:HweBenchProbeAgent"

[project.scripts]
verigym-hwe-bench = "verigym_hwe_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verigym_hwe_bench = ["py.typed", "assets/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "external_benchmark: requires an explicitly prepared official HWE-Bench source",
  "docker: requires a reachable Docker daemon and one explicitly selected HWE-Bench image",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym_hwe_bench"]
