[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verigym-rtllm"
version = "0.3.0"
description = "Pinned metadata-driven external-source RTLLM suite adapter for VeriGym."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "VeriGym contributors"}]
dependencies = ["verigym>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.entry-points."verigym.suites"]
rtllm = "verigym_rtllm:RTLLMSuite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verigym_rtllm = [
  "py.typed",
  "assets/workspace/README.md",
  "assets/workspace/rtl/*.v",
  "assets/workspace_up_down/README.md",
  "assets/workspace_up_down/rtl/*.v",
  "assets/public_smoke/*.sv",
  "assets/public_smoke_harder/*.sv",
  "assets/workspace_harder/rtl/*.v",
  "assets/public_smoke_l2_batch1/*.sv",
  "assets/workspace_l2_batch1/rtl/*.v",
  "assets/public_smoke_l2_batch2/*.sv",
  "assets/workspace_l2_batch2/rtl/*.v",
  "assets/public_smoke_l2_full/*.sv",
  "assets/workspace_l2_full/rtl/*.v",
  "assets/workspace_all/README.md",
  "assets/rtllm_v2_additional_tasks.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "commercial: requires site-installed licensed commercial tools",
  "external_benchmark: requires an explicitly supplied external benchmark checkout",
  "docker_integration: requires an explicitly supplied local Docker image",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym_rtllm"]
