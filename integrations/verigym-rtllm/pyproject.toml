[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verigym-rtllm"
version = "0.2.0"
description = "Pinned external-source RTLLM counter-family suite adapter for VeriGym."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "VeriGym contributors"}]
dependencies = ["verigym>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.entry-points."verigym.suites"]
rtllm = "verigym_rtllm:RTLLMSuite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verigym_rtllm = [
  "py.typed",
  "assets/workspace/README.md",
  "assets/workspace/rtl/*.v",
  "assets/workspace_up_down/README.md",
  "assets/workspace_up_down/rtl/*.v",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["commercial: requires site-installed licensed commercial tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym_rtllm"]
