[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verigym-synopsys"
version = "0.1.0"
description = "Optional Synopsys VCS, Design Compiler, and Formality backends for VeriGym."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "VeriGym contributors"}]
dependencies = ["verigym>=0.1.0,<0.2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.entry-points."verigym.tools"]
synopsys-vcs-simulate = "verigym_synopsys:VcsSimulationTool"
synopsys-dc-synthesis = "verigym_synopsys:DesignCompilerSynthesisTool"
synopsys-formality-equivalence = "verigym_synopsys:FormalityEquivalenceTool"

[project.scripts]
verigym-synopsys-prepare-profile = "verigym_synopsys.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verigym_synopsys = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["commercial: requires site-installed licensed Synopsys tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym_synopsys"]
