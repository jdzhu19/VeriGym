[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "verigym-codex-cli"
version = "0.1.0"
description = "Auditable Codex CLI conformance tracks for VeriGym."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["verigym==0.1.0"]

[project.entry-points."verigym.agents"]
codex-cli-agent = "verigym_codex_cli:CodexCliAgentAdapter"
codex-cli-readonly-agent = "verigym_codex_cli:CodexCliReadonlyAgentAdapter"
codex-cli-mcp-teacher = "verigym_codex_cli:CodexCliMcpTeacherAdapter"

[project.scripts]
verigym-codex = "verigym_codex_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "codex_cli: exercises a Codex CLI integration path",
  "codex_cli_readonly_agent: exercises the read-only single-turn CLI agent path",
  "codex_cli_agent: exercises the external coding-agent path",
  "codex_cli_pilot: exercises the protected real-model pilot",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym_codex_cli"]
