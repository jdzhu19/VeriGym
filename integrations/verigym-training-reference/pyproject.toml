[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verigym-training-reference"
version = "0.3.0"
description = "Framework-neutral external training reference pipeline for VeriGym."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "VeriGym contributors"}]
dependencies = ["verigym>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.scripts]
verigym-training-reference = "verigym_training_reference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verigym_training_reference = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["verigym_training_reference"]
